name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação estática
        run: npm run check

      - name: Testes
        run: npm test

      - name: Build do pacote
        run: npm run build -- --zip

      - name: Teste de fumaça no pacote gerado
        run: npm run smoke

      - name: Publicar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: optante-facil
          path: release/*.zip
          if-no-files-found: error
